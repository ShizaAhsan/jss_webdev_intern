<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — JobSkillShare</title>
  <meta name="description" content="Sign in to your JobSkillShare account to access your IT learning dashboard, labs, and certificates.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login-style.css">
</head>
<body>

  <!-- Decorative blobs -->
  <div class="auth-blob auth-blob-1"></div>
  <div class="auth-blob auth-blob-2"></div>
  <div class="auth-blob auth-blob-3"></div>

  <!-- Top bar -->
  <div class="auth-topbar">
    <a href="index.html" aria-label="JobSkillShare Home">
      <img src="assest/logo.png" alt="JobSkillShare Logo" style="height:52px;display:block;">
    </a>
    <a href="javascript:history.length > 1 ? history.back() : window.location.href='index.html'" class="auth-topbar-back">
      ← Back to site
    </a>
  </div>

  <!-- Centered card -->
  <div class="auth-center">
    <div class="glass-card">

      <!-- Badge -->
      <span class="glass-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Sign In to JobSkillShare
      </span>

      <h1 class="glass-title">Welcome back</h1>
      <p class="glass-subtitle">Access your IT learning dashboard and labs</p>

      <!-- Alerts -->
      <div class="glass-alert glass-alert-error" id="loginError" style="display:none;"></div>
      <div class="glass-alert glass-alert-success" id="loginSuccess" style="display:none;"></div>

      <!-- Google -->
      <button class="btn-google" id="googleSignInBtn" onclick="signInWithGoogle()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width:20px;height:20px;">
        Continue with Google
      </button>

      <div class="glass-divider"><span>or sign in with email</span></div>

      <!-- Login form -->
      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="glass-field">
          <label class="glass-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="glass-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="glass-field">
          <label class="glass-label" for="loginPassword">Password</label>
          <div class="pw-wrap">
            <input type="password" id="loginPassword" class="glass-input" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:48px;">
            <button type="button" class="pw-toggle" onclick="togglePass('loginPassword', this)" aria-label="Toggle password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-row-glass">
          <label class="glass-remember">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="glass-forgot" onclick="handleForgotPassword(event)">Forgot password?</a>
        </div>

        <button type="submit" class="btn-glass-submit" id="loginBtn">
          <span class="btn-text">Login</span>
          <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <p class="glass-footer">
        Don't have an account? <a href="index.html#pricing">Create one free →</a>
      </p>
    </div>

    <!-- Stats strip -->
    <div class="auth-stats-strip">
      <div class="a-stat-item">
        <span class="a-stat-num">50,000+</span>
        <span class="a-stat-lbl">Active Learners</span>
      </div>
      <div class="a-stat-sep"></div>
      <div class="a-stat-item">
        <span class="a-stat-num">100%</span>
        <span class="a-stat-lbl">Hands-on Labs</span>
      </div>
      <div class="a-stat-sep"></div>
      <div class="a-stat-item">
        <span class="a-stat-num">95%</span>
        <span class="a-stat-lbl">Job Placement</span>
      </div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
